<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON + PNG to MP4 Video Generator</title>
    
    <!-- JSZip for extracting the ZIP file -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <!-- FFmpeg.wasm and Util (UMD builds) -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/umd/index.js"></script>

    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --text-light: #6B7280;
            --border: #E5E7EB;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: var(--card-bg);
            max-width: 600px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
        }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 5px; text-align: center; }
        p.subtitle { color: var(--text-light); text-align: center; margin-bottom: 25px; font-size: 0.95rem; }
        
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed var(--border);
            border-radius: 8px;
            cursor: pointer;
            background-color: #F9FAFB;
        }
        input[type="file"]:hover { border-color: var(--primary); }
        
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #9CA3AF; cursor: not-allowed; }

        .status-container { margin-top: 20px; display: none; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        #log {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-light);
            background: #F9FAFB;
            padding: 10px;
            border-radius: 6px;
            height: 100px;
            overflow-y: auto;
            border: 1px solid var(--border);
            white-space: pre-wrap;
        }

        .result-container { margin-top: 25px; display: none; }
        video {
            width: 100%;
            border-radius: 8px;
            background-color: #000;
            margin-bottom: 15px;
        }
        .download-btn {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            background-color: #10B981;
            color: white;
            font-weight: 600;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        .download-btn:hover { background-color: #059669; }
    </style>
</head>
<body>

<div class="container">
    <h1>JSON + Frames to MP4</h1>
    <p class="subtitle">Generate high-quality video perfectly synced to your timings.</p>

    <div class="input-group">
        <label for="jsonInput">1. Upload Sequence JSON file</label>
        <input type="file" id="jsonInput" accept=".json">
    </div>

    <div class="input-group">
        <label for="zipInput">2. Upload ZIP file containing Frames (.png)</label>
        <input type="file" id="zipInput" accept=".zip">
    </div>

    <button id="generateBtn" onclick="window.startProcess()">Generate MP4 Video</button>

    <div class="status-container" id="statusContainer">
        <label id="statusText">Initializing...</label>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div id="log"></div>
    </div>

    <div class="result-container" id="resultContainer">
        <label>Result Preview:</label>
        <video id="outputVideo" controls></video>
        <a id="downloadBtn" class="download-btn" href="#" download="output_hq.mp4">Download Ultra-HQ MP4</a>
    </div>
</div>

<script>
    // Wait for DOM to prevent variable scope leaking/conflicts
    document.addEventListener("DOMContentLoaded", () => {
        
        let ffmpegInstance = null; // Private singleton

        function logMessage(msg) {
            const logEl = document.getElementById('log');
            logEl.textContent += msg + '\n';
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }

        async function initFFmpeg() {
            if (ffmpegInstance) return ffmpegInstance;

            // 1. Destructure correctly from the UMD globals that @ffmpeg/ffmpeg v12 exposes.
            const { FFmpeg } = window.FFmpegWASM;
            const { toBlobURL } = window.FFmpegUtil;

            const ffmpeg = new FFmpeg();
            
            ffmpeg.on('log', ({ message }) => logMessage(message));
            
            ffmpeg.on('progress', ({ progress, time }) => {
                const percentage = Math.max(0, Math.min(100, progress * 100));
                document.getElementById('progressFill').style.width = `${percentage}%`;
                document.getElementById('statusText').innerText = `Encoding Video... ${Math.round(percentage)}%`;
            });

            // 2. Fetch dependencies via toBlobURL. 
            // Bypasses strict MIME and cross-origin blocking typically triggered on hosted web servers.
            const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
            
            logMessage("Downloading FFmpeg Core Engine...");
            await ffmpeg.load({
                coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
            });

            ffmpegInstance = ffmpeg;
            return ffmpegInstance;
        }

        window.startProcess = async function() {
            const jsonInput = document.getElementById('jsonInput');
            const zipInput = document.getElementById('zipInput');
            
            if (!jsonInput.files[0] || !zipInput.files[0]) {
                alert("Please upload both the JSON file and the ZIP file.");
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerText = "Processing...";
            
            document.getElementById('statusContainer').style.display = 'block';
            document.getElementById('resultContainer').style.display = 'none';
            document.getElementById('log').textContent = '';
            document.getElementById('progressFill').style.width = '0%';
            document.getElementById('statusText').innerText = "Loading FFmpeg Engine...";

            try {
                // Initialize safely
                const ffmpeg = await initFFmpeg();

                // Read and Parse JSON
                document.getElementById('statusText').innerText = "Parsing JSON & Unzipping frames...";
                const jsonText = await jsonInput.files[0].text();
                const sequenceData = JSON.parse(jsonText);

                // Read and Unzip images
                const zipBuffer = await zipInput.files[0].arrayBuffer();
                const zip = await JSZip.loadAsync(zipBuffer);

                let concatText = '';
                logMessage("Extracting frames and writing to virtual file system...");

                // Iterate over sequence and write frames to FFmpeg Virtual File System
                for (let i = 0; i < sequenceData.length; i++) {
                    const item = sequenceData[i];
                    
                    const duration = (item.end - item.start).toFixed(3);
                    const fileInZip = zip.file(item.frame);
                    
                    if (!fileInZip) {
                        throw new Error(`File '${item.frame}' mentioned in JSON was not found in the ZIP!`);
                    }
                    
                    const imgData = await fileInZip.async('uint8array');
                    
                    await ffmpeg.writeFile(item.frame, imgData);
                    
                    concatText += `file '${item.frame}'\n`;
                    concatText += `duration ${duration}\n`;
                }

                // FFmpeg Concat Demuxer Quirk (The last file must be redeclared to not be dropped)
                if (sequenceData.length > 0) {
                    const lastItem = sequenceData[sequenceData.length - 1];
                    concatText += `file '${lastItem.frame}'\n`;
                }

                // Write the instructions text file
                await ffmpeg.writeFile('input.txt', concatText);

                document.getElementById('statusText').innerText = "Encoding high-quality MP4...";

                // Run FFmpeg command
                await ffmpeg.exec([
                    '-f', 'concat', 
                    '-safe', '0', 
                    '-i', 'input.txt', 
                    '-vf', 'scale=trunc(iw/2)*2:trunc(ih/2)*2',
                    '-c:v', 'libx264', 
                    '-preset', 'slow', 
                    '-crf', '15', 
                    '-pix_fmt', 'yuv420p', 
                    'output.mp4'
                ]);

                // Retrieve the generated file
                document.getElementById('statusText').innerText = "Finalizing video...";
                const fileData = await ffmpeg.readFile('output.mp4');
                const videoBlob = new Blob([fileData.buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(videoBlob);

                // Display the result
                const videoEl = document.getElementById('outputVideo');
                videoEl.src = videoUrl;
                
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.href = videoUrl;

                document.getElementById('statusContainer').style.display = 'none';
                document.getElementById('resultContainer').style.display = 'block';

            } catch (error) {
                console.error(error);
                alert("An error occurred: " + error.message);
                document.getElementById('statusText').innerText = "Failed!";
                document.getElementById('progressFill').style.backgroundColor = "#EF4444";
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate MP4 Video";
            }
        };
    });
</script>

</body>
</html>
