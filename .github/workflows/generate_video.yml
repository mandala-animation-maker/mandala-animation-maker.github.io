name: Generate MP4 Video

# This allows you to trigger the workflow manually from the GitHub Actions tab
on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      # 1. Grab your files from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install FFmpeg on the GitHub Server
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Run your Python script
      - name: Run Video Generator
        run: python generate.py

      # 5. Upload the finished MP4 so you can download it
      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Video-HQ
          path: output_hq.mp4
          retention-days: 7