<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Drift's Video Edition</title>
    
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    
    <!-- JSZip for client-side batch ZIP generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        /* Timeless & Neutral Color Palette from Brand Reference */
        :root {
            --bg-color: #faf8f5;        
            --panel-bg: #ffffff;        
            --border-color: #eae5df;    
            --text-primary: #1b1a18;    
            --text-muted: #7c766e;      
            --accent: #1b1a18;          
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* Semantic Header & Navigation Styles */
        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .logo-link {
            font-family: monospace;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        /* Tool Context Intro Details */
        .tool-intro {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 25px;
        }

        .tool-intro h1 {
            font-family: sans-serif;
            font-weight: 700;
            font-size: 1.75rem;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .tool-subtitle {
            font-family: sans-serif;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Two-Column Layout */
        .app-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 40px;
            width: 100%;
            max-width: 1100px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.02);
            margin-bottom: 60px;
        }

        @media (max-width: 950px) {
            .app-layout {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 20px;
            }
        }

        /* --- PREVIEW COLUMN --- */
        .preview-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            min-width: 0;
        }

        /* Canvas container with scaling backdrops */
        .canvas-container {
            position: relative;
            width: 100%;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
            background-image: conic-gradient(#f3f1ed 0.25turn, #ffffff 0.25turn 0.5turn, #f3f1ed 0.5turn 0.75turn, #ffffff 0.75turn);
            background-size: 16px 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: aspect-ratio 0.3s ease;
            margin: 0 auto;
        }

        /* Fluid Responsive Canvas Ratios */
        .canvas-container[data-ratio="9:16"] { 
            aspect-ratio: 9 / 16; 
            max-width: 360px;
        }
        
        .canvas-container[data-ratio="4:5"] { 
            aspect-ratio: 4 / 5; 
            max-width: 450px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        /* --- FRAME SCRUBBER --- */
        .scrubber-panel {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .scrubber-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .scrub-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            flex-shrink: 0;
            transition: background 0.2s;
        }
        
        .scrub-btn:hover { background: var(--bg-color); }
        .scrub-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .frame-counter { 
            font-size: 0.8rem; 
            font-family: monospace;
            font-weight: 600; 
            font-variant-numeric: tabular-nums; 
            text-align: center;
            color: var(--text-primary);
        }

        /* --- CONTROL COLUMN --- */
        .control-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 25px;
            min-width: 0;
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-family: sans-serif;
        }

        /* Input specific classes matching Brand UI */
        .text-input-wrapper { position: relative; }

        .text-input {
            width: 100%;
            font-size: 1.1rem;
            padding: 12px 0;
            border: none;
            border-bottom: 2px solid var(--accent);
            outline: none;
            background: transparent;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: 0.02em;
            resize: vertical;
            min-height: 120px;
            line-height: 1.3;
        }

        .text-input::placeholder { color: #d1cbc4; }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            font-family: sans-serif;
            margin-top: -10px;
        }

        .toggle-group {
            display: flex;
            border: 1px solid var(--border-color);
            width: 100%;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px 6px;
            background: var(--panel-bg);
            border: none;
            border-right: 1px solid var(--border-color);
            font-family: sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }
        
        .toggle-btn:last-child { border-right: none; }
        .toggle-btn.active { background: var(--text-primary); color: #fff; }

        .advanced-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 5px;
        }

        /* Value Display and Input Ranges */
        .value-display {
            color: var(--text-primary);
            font-family: monospace;
            font-size: 0.85rem;
        }

        .value-display[contenteditable="true"] {
            cursor: text;
            outline: none;
            border-bottom: 1px dashed var(--text-muted);
            min-width: 40px;
            display: inline-block;
            text-align: right;
            transition: border-bottom-color 0.2s ease;
        }

        .value-display[contenteditable="true"]:focus { border-bottom-color: var(--accent); }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 2px;
            background: #e2ded9;
            outline: none;
            margin: 10px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }

        .color-selector {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            padding: 4px;
            gap: 10px;
            background: var(--panel-bg);
            justify-content: space-between;
            width: 100%;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border-color); }

        /* Buttons */
        .btn-download {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 16px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease;
            width: 100%;
            margin-top: 15px;
            font-family: sans-serif;
        }

        .btn-download:hover { opacity: 0.9; }
        .btn-download:active { transform: scale(0.995); }
        .btn-download:disabled { background: var(--text-muted); cursor: not-allowed; transform: none; }

        /* Footer */
        footer {
            width: 100%;
            max-width: 1100px;
            border-top: 1px solid var(--border-color);
            padding: 30px 0;
            text-align: center;
            margin-top: auto;
        }

        footer p {
            font-family: sans-serif;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>

    <header role="banner">
        <a href="/" class="logo-link">Callistra.design</a>
    </header>

    <main role="main" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="tool-intro">
            <h1>Pixel Drift's Video Edition</h1>
            <p class="tool-subtitle">Paste your script. Every line generates a 4K frame. Export directly to ZIP.</p>
        </div>

        <div class="app-layout">
            
            <!-- Preview Column (Left - Following the new brand logic) -->
            <div class="preview-column">
                
                <div class="canvas-container" id="canvasContainer" data-ratio="9:16">
                    <canvas id="previewCanvas"></canvas>
                </div>

                <div class="scrubber-panel">
                    <div class="scrubber-controls">
                        <button class="scrub-btn" id="btnPrev">◄ Prev</button>
                        <span class="frame-counter" id="frameCounterUI">Frame 1 of 4</span>
                        <button class="scrub-btn" id="btnNext">Next ►</button>
                    </div>
                    <input type="range" id="frameSlider" min="1" max="4" value="1">
                </div>

            </div>

            <!-- Control Column (Right) -->
            <div class="control-panel">
                <div class="controls-group">
                    
                    <div class="control-row">
                        <div class="control-header">
                            <label>1. Script Input</label>
                            <span id="lblTotalFrames" style="font-family: monospace; color: var(--text-primary);">Frames: 4</span>
                        </div>
                        <div class="text-input-wrapper">
                            <textarea id="scriptInput" class="text-input" placeholder="Paste your script here...">NEVER
LOOK
BACK
AGAIN</textarea>
                        </div>
                        <label class="checkbox-label">
                            <input type="checkbox" id="ignoreBlank" checked>
                            Ignore blank lines automatically
                        </label>
                    </div>

                    <div class="control-row">
                        <div class="control-header"><label>2. Canvas Setup</label></div>
                        <div class="toggle-group" id="ratioToggleGroup">
                            <button class="toggle-btn active" data-ratio="9:16">9:16 Vertical</button>
                            <button class="toggle-btn" data-ratio="4:5">4:5 Portrait</button>
                        </div>
                    </div>

                    <div class="advanced-grid">
                        <div class="control-row">
                            <div class="control-header"><label>Background</label></div>
                            <div class="color-selector">
                                <input type="color" id="bgColor" value="#1b1a18">
                                <span id="v_bgColor" class="value-display" contenteditable="true" style="font-size: 0.75rem;">#1B1A18</span>
                            </div>
                        </div>
                        <div class="control-row">
                            <div class="control-header"><label>Text Color</label></div>
                            <div class="color-selector">
                                <input type="color" id="textColor" value="#faf8f5">
                                <span id="v_textColor" class="value-display" contenteditable="true" style="font-size: 0.75rem;">#FAF8F5</span>
                            </div>
                        </div>
                    </div>

                    <div class="control-row" style="margin-top: 10px;">
                        <div class="control-header">
                            <label>3. Global Aesthetics</label>
                        </div>
                        
                        <div class="control-row">
                            <div class="control-header">
                                <label for="blockSize">Grid Block Size</label>
                                <span id="v_blockSize" class="value-display" contenteditable="true">20px</span>
                            </div>
                            <input type="range" id="blockSize" min="2" max="100" step="1" value="20">
                        </div>
                        
                        <div class="control-row">
                            <div class="control-header">
                                <label for="drift">Scatter Amount</label>
                                <span id="v_drift" class="value-display" contenteditable="true">15px</span>
                            </div>
                            <input type="range" id="drift" min="0" max="150" step="1" value="15">
                        </div>

                        <div class="control-row">
                            <div class="control-header">
                                <label for="fontSize">Base Font Size</label>
                                <span id="v_fontSize" class="value-display" contenteditable="true">180px</span>
                            </div>
                            <input type="range" id="fontSize" min="50" max="400" value="180">
                        </div>
                    </div>
                    
                </div>

                <div>
                    <button class="btn-download" id="btnExport">Download All Frames (.ZIP)</button>
                </div>
            </div>

        </div>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 Callistra.design. All creative tools processed purely client-side for maximum privacy.</p>
    </footer>

    <script>
        // --- Core State Variables ---
        let lines = [];
        let currentFrameIndex = 0;
        let activeRatio = "9:16"; 
        let renderPending = false;

        const PREVIEW_WIDTH = 540; 
        const EXPORT_WIDTH = 2160;

        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d', { willReadFrequently: true });

        // --- DOM Elements ---
        const ui = {
            scriptInput: document.getElementById('scriptInput'),
            ignoreBlank: document.getElementById('ignoreBlank'),
            lblTotalFrames: document.getElementById('lblTotalFrames'),
            ratioBtns: document.querySelectorAll('.toggle-btn'),
            canvasContainer: document.getElementById('canvasContainer'),
            
            // Sliders & Colors
            bgColor: document.getElementById('bgColor'),
            textColor: document.getElementById('textColor'),
            blockSize: document.getElementById('blockSize'),
            drift: document.getElementById('drift'),
            fontSize: document.getElementById('fontSize'),
            
            // Scrubber
            btnPrev: document.getElementById('btnPrev'),
            btnNext: document.getElementById('btnNext'),
            frameSlider: document.getElementById('frameSlider'),
            frameCounterUI: document.getElementById('frameCounterUI'),
            
            // Export
            btnExport: document.getElementById('btnExport')
        };

        // --- Initialization & Event Listeners ---
        function init() {
            parseScript();

            // Text Input Listeners
            ui.scriptInput.addEventListener('input', () => { parseScript(); });
            ui.scriptInput.addEventListener('click', trackCursor);
            ui.scriptInput.addEventListener('keyup', trackCursor);
            ui.ignoreBlank.addEventListener('change', () => { parseScript(); });

            // Aspect Ratio Listeners
            ui.ratioBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    ui.ratioBtns.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    activeRatio = e.target.getAttribute('data-ratio');
                    ui.canvasContainer.setAttribute('data-ratio', activeRatio);
                    updateCanvasDimensions();
                    queueDraw();
                });
            });

            // Bind Editable Sliders & UI
            setupEditableValue('blockSize');
            setupEditableValue('drift');
            setupEditableValue('fontSize');
            setupEditableColor('bgColor');
            setupEditableColor('textColor');

            // Scrubber Listeners
            ui.frameSlider.addEventListener('input', (e) => {
                currentFrameIndex = parseInt(e.target.value) - 1;
                updateScrubberState();
                queueDraw();
            });
            ui.btnPrev.addEventListener('click', () => {
                if (currentFrameIndex > 0) {
                    currentFrameIndex--;
                    updateScrubberState();
                    queueDraw();
                }
            });
            ui.btnNext.addEventListener('click', () => {
                if (currentFrameIndex < lines.length - 1) {
                    currentFrameIndex++;
                    updateScrubberState();
                    queueDraw();
                }
            });

            // Export
            ui.btnExport.addEventListener('click', exportZipPack);

            // Set initial dimensions and draw
            updateCanvasDimensions();
            document.fonts.ready.then(() => queueDraw());
        }

        // --- UX Interaction Functions ---
        function setupEditableValue(id) {
            const input = document.getElementById(id);
            const span = document.getElementById('v_' + id);
            
            input.addEventListener('input', (e) => {
                if (document.activeElement !== span) {
                    span.innerText = e.target.value + 'px';
                }
                queueDraw();
            });

            span.addEventListener('input', () => {
                let val = parseInt(span.innerText.replace(/[^0-9-]/g, ''));
                if (!isNaN(val)) {
                    input.value = val;
                    queueDraw();
                }
            });

            span.addEventListener('blur', () => {
                span.innerText = input.value + 'px';
            });
        }

        function setupEditableColor(id) {
            const input = document.getElementById(id);
            const span = document.getElementById('v_' + id);

            input.addEventListener('input', (e) => {
                if (document.activeElement !== span) {
                    span.innerText = e.target.value.toUpperCase();
                }
                queueDraw();
            });

            span.addEventListener('input', () => {
                let val = span.innerText.trim();
                if (!val.startsWith('#')) val = '#' + val;
                if (/^#([0-9A-Fa-f]{3})$/.test(val)) {
                    val = '#' + val[1] + val[1] + val[2] + val[2] + val[3] + val[3];
                }
                if (/^#([0-9A-Fa-f]{6})$/.test(val)) {
                    input.value = val;
                    queueDraw();
                }
            });

            span.addEventListener('blur', () => {
                span.innerText = input.value.toUpperCase();
            });
        }

        // --- Logic: Script Parsing & Cursor Tracking ---
        function parseScript() {
            const rawText = ui.scriptInput.value;
            const ignore = ui.ignoreBlank.checked;
            const rawLines = rawText.split('\n');

            if (ignore) {
                lines = rawLines.map(l => l.trim()).filter(l => l.length > 0);
            } else {
                lines = rawLines.map(l => l.trim());
            }

            if (lines.length === 0) lines = [""];

            ui.lblTotalFrames.innerText = `Frames: ${lines.length}`;
            ui.frameSlider.max = lines.length;

            if (currentFrameIndex >= lines.length) {
                currentFrameIndex = lines.length - 1;
            }

            updateScrubberState();
            queueDraw();
        }

        function trackCursor(e) {
            const text = e.target.value;
            const cursorPosition = e.target.selectionStart;
            const textBeforeCursor = text.substring(0, cursorPosition);
            const rawLineIndex = textBeforeCursor.split('\n').length - 1;

            const ignore = ui.ignoreBlank.checked;
            let activeIndex = 0;

            if (ignore) {
                const validLinesBefore = textBeforeCursor.split('\n')
                    .map(l => l.trim())
                    .filter(l => l.length > 0).length;
                
                activeIndex = validLinesBefore > 0 ? validLinesBefore - 1 : 0;
            } else {
                activeIndex = rawLineIndex;
            }

            if (activeIndex !== currentFrameIndex && activeIndex < lines.length) {
                currentFrameIndex = activeIndex;
                updateScrubberState();
                queueDraw();
            }
        }

        function updateScrubberState() {
            ui.frameSlider.value = currentFrameIndex + 1;
            ui.frameCounterUI.innerText = `Frame ${currentFrameIndex + 1} of ${lines.length}`;
            
            ui.btnPrev.disabled = currentFrameIndex === 0;
            ui.btnNext.disabled = currentFrameIndex === lines.length - 1;
        }

        // --- Logic: Rendering Engine ---
        function updateCanvasDimensions() {
            previewCanvas.width = PREVIEW_WIDTH;
            previewCanvas.height = activeRatio === "9:16" ? 960 : 675;
        }

        function getSpatialRandom(x, y) {
            let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            return n - Math.floor(n);
        }

        function queueDraw() {
            if (!renderPending) {
                renderPending = true;
                requestAnimationFrame(() => {
                    renderSingleFrame(
                        previewCtx, 
                        previewCanvas.width, 
                        previewCanvas.height, 
                        1, 
                        lines[currentFrameIndex] || ""
                    );
                    renderPending = false;
                });
            }
        }

        function renderSingleFrame(targetCtx, tWidth, tHeight, renderScale, textToDraw) {
            // Fill Background
            const bgColor = ui.bgColor.value;
            targetCtx.fillStyle = bgColor;
            targetCtx.fillRect(0, 0, tWidth, tHeight);

            if (!textToDraw) return;

            // Glitch Parameters
            let origBlockSize = parseInt(ui.blockSize.value) || 20;
            let origDrift = parseInt(ui.drift.value) || 15;
            let origFontSize = parseInt(ui.fontSize.value) || 180;
            const textColor = ui.textColor.value;

            const scaledDrift = origDrift * renderScale;
            
            const padding = (scaledDrift * 2) + (40 * renderScale);
            const safeWidth = tWidth - padding;

            // Offscreen Text Buffer
            const textCanvas = document.createElement('canvas');
            textCanvas.width = tWidth;
            textCanvas.height = tHeight;
            const tCtx = textCanvas.getContext('2d', { willReadFrequently: true });

            let testFont = `900 ${origFontSize * renderScale}px "Montserrat", sans-serif`;
            tCtx.font = testFont;
            let textWidth = tCtx.measureText(textToDraw).width;
            
            let finalFontSize = origFontSize * renderScale;
            if (textWidth > safeWidth) {
                finalFontSize = (safeWidth / textWidth) * finalFontSize;
            }

            tCtx.font = `900 ${finalFontSize}px "Montserrat", sans-serif`;
            tCtx.textAlign = 'center';
            tCtx.textBaseline = 'middle';
            tCtx.fillStyle = textColor;
            
            tCtx.fillText(textToDraw, tWidth / 2, tHeight / 2);

            // Extract Buffers
            const sourceData = tCtx.getImageData(0, 0, tWidth, tHeight);
            const sourceBuffer = new Uint32Array(sourceData.data.buffer);
            
            const targetData = targetCtx.getImageData(0, 0, tWidth, tHeight);
            const targetBuffer = new Uint32Array(targetData.data.buffer);

            const step = Math.max(1, origBlockSize);
            const wScan = tWidth / renderScale;
            const hScan = tHeight / renderScale;

            for (let y = 0; y < hScan; y += step) {
                for (let x = 0; x < wScan; x += step) {
                    
                    const randX = getSpatialRandom(x, y);
                    const randY = getSpatialRandom(x + 100, y + 100);

                    const driftOffsetX = Math.round((randX - 0.5) * scaledDrift);
                    const driftOffsetY = Math.round((randY - 0.5) * scaledDrift);
                    
                    const scaledX = Math.round(x * renderScale);
                    const scaledY = Math.round(y * renderScale);

                    const destX = scaledX + driftOffsetX;
                    const destY = scaledY + driftOffsetY;
                    
                    const nextScaledX = Math.round((x + step) * renderScale);
                    const nextScaledY = Math.round((y + step) * renderScale);
                    
                    const blockW = Math.min(nextScaledX - scaledX, tWidth - scaledX);
                    const blockH = Math.min(nextScaledY - scaledY, tHeight - scaledY);

                    for (let by = 0; by < blockH; by++) {
                        const sy = scaledY + by;
                        const dy = destY + by;
                        
                        if (dy >= 0 && dy < tHeight) {
                            for (let bx = 0; bx < blockW; bx++) {
                                const sx = scaledX + bx;
                                const dx = destX + bx;
                                
                                if (dx >= 0 && dx < tWidth && sy >= 0 && sx >= 0 && sy < tHeight && sx < tWidth) {
                                    const sourcePixel = sourceBuffer[sy * tWidth + sx];
                                    
                                    if (sourcePixel !== 0) {
                                        targetBuffer[dy * tWidth + dx] = sourcePixel;
                                    }
                                }
                            }
                        }
                    }
                }
            }

            targetCtx.putImageData(targetData, 0, 0);
        }

        // --- Logic: 4K Batch Exporter ---
        async function exportZipPack() {
            if (lines.length === 0 || (lines.length === 1 && lines[0] === "")) {
                alert("No text to export.");
                return;
            }

            ui.btnExport.disabled = true;
            const originalBtnText = ui.btnExport.innerText;

            try {
                ui.btnExport.innerText = "INITIALIZING EXPORT...";
                await new Promise(r => setTimeout(r, 50));

                const zip = new JSZip();
                const folder = zip.folder("Pixel_Drift_Frames");

                const scale = EXPORT_WIDTH / PREVIEW_WIDTH;
                const tWidth = EXPORT_WIDTH;
                const tHeight = activeRatio === "9:16" ? 3840 : 2700;

                const expCanvas = document.createElement('canvas');
                expCanvas.width = tWidth;
                expCanvas.height = tHeight;
                const expCtx = expCanvas.getContext('2d', { willReadFrequently: true });

                for (let i = 0; i < lines.length; i++) {
                    ui.btnExport.innerText = `RENDERING FRAME ${i + 1} OF ${lines.length}...`;
                    await new Promise(r => setTimeout(r, 10));

                    renderSingleFrame(expCtx, tWidth, tHeight, scale, lines[i]);

                    const blob = await new Promise(resolve => expCanvas.toBlob(resolve, 'image/png'));
                    const frameNum = String(i + 1).padStart(3, '0');
                    folder.file(`frame_${frameNum}.png`, blob);
                }

                ui.btnExport.innerText = "ZIPPING PACK (.ZIP)...";
                await new Promise(r => setTimeout(r, 20));

                const zipBlob = await zip.generateAsync({ type: "blob" });
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(zipBlob);
                link.download = `Pixel_Drift_Video_Edition_${activeRatio.replace(':','_')}.zip`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => URL.revokeObjectURL(link.href), 5000);

            } catch (err) {
                console.error("Export failed:", err);
                alert("An error occurred during ZIP generation.");
            } finally {
                ui.btnExport.innerText = originalBtnText;
                ui.btnExport.disabled = false;
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
