<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Sync Video Generator</title>
    
    <!-- JSZip for extracting the ZIP file -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <!-- Swapped to jsDelivr CDN for better global reliability -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/umd/index.js"></script>

    <style>
        :root { --primary: #0ea5e9; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #cbd5e1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .container { background: var(--card); max-width: 650px; width: 100%; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); padding: 25px; }
        h1 { text-align: center; margin-bottom: 5px; color: var(--primary); font-size: 1.5rem; }
        p.subtitle { text-align: center; font-size: 0.9rem; color: #64748b; margin-bottom: 25px; }
        
        .input-group { background: #f1f5f9; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border); }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #334155; font-size: 0.95rem; }
        input[type="file"] { width: 100%; cursor: pointer; font-size: 0.9rem; }
        
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.2s; }
        button:hover { background: #0284c7; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        
        .progress-bar { width: 100%; height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; margin: 15px 0; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s; }
        #log { background: #1e293b; color: #38bdf8; padding: 10px; font-family: monospace; font-size: 0.75rem; border-radius: 6px; height: 120px; overflow-y: auto; white-space: pre-wrap; margin-top: 10px; }
        
        .result-container { display: none; margin-top: 20px; border-top: 2px solid var(--border); padding-top: 20px; }
        video { width: 100%; border-radius: 8px; background: #000; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .download-btn { display: block; text-align: center; background: #10b981; color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.2s; }
        
        #mobileWarning { display: none; background: #fff3cd; color: #856404; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

<div class="container">
    <h1>Video Generator Pro</h1>
    <p class="subtitle">100% Sync • Custom Audio • ZIP Uploads</p>

    <div id="mobileWarning">
        ⚠️ <b>Mobile Device Detected:</b> Video generation uses massive amounts of RAM. If your browser crashes during generation, you must use a Computer.
    </div>

    <div class="input-group">
        <label>1. Upload sequence.json</label>
        <input type="file" id="jsonInput" accept=".json">
    </div>

    <div class="input-group">
        <label>2. Upload Audio (.wav or .mp3) [Optional]</label>
        <input type="file" id="audioInput" accept="audio/*">
    </div>

    <div class="input-group">
        <label>3. Upload Frames (.zip file)</label>
        <input type="file" id="zipInput" accept=".zip">
    </div>

    <button id="generateBtn" onclick="window.startProcess()">Generate MP4 Video</button>

    <div class="status-container" id="statusContainer" style="display: none; margin-top: 20px;">
        <label id="statusText" style="text-align: center;">Initializing Engine...</label>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div id="log"></div>
    </div>

    <div class="result-container" id="resultContainer">
        <h3 style="margin-bottom: 10px; text-align: center;">Success! Your Video is Ready</h3>
        <video id="outputVideo" controls></video>
        <a id="downloadBtn" class="download-btn" href="#" download="synced_output.mp4">Download MP4 Video</a>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        
        // Show Mobile Warning
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
            document.getElementById('mobileWarning').style.display = 'block';
        }

        let ffmpegInstance = null;
        
        function logMsg(msg) {
            const logEl = document.getElementById('log');
            logEl.textContent += msg + '\n';
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function initFFmpeg() {
            if (ffmpegInstance) return ffmpegInstance;
            
            // ERROR FIX 1: Safely check if the main library loaded at all
            if (typeof window.FFmpegWASM === 'undefined') {
                throw new Error("FFmpeg failed to load. Please check your internet connection.");
            }
            
            const { FFmpeg } = window.FFmpegWASM;
            const ffmpeg = new FFmpeg();
            
            ffmpeg.on('log', ({ message }) => logMsg(message));
            ffmpeg.on('progress', ({ progress }) => {
                let perc = Math.max(0, Math.min(100, progress * 100));
                document.getElementById('progressFill').style.width = `${perc}%`;
                document.getElementById('statusText').innerText = `Encoding Engine Working... ${Math.round(perc)}%`;
            });

            // ERROR FIX 2: Safely grab the Utility object (Accounting for naming differences)
            const util = window.FFmpegUtil || window.ffmpegUtil || window.ffmpegutil;
            
            const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';
            let coreURL = `${baseURL}/ffmpeg-core.js`;
            let wasmURL = `${baseURL}/ffmpeg-core.wasm`;

            // ERROR FIX 3: Failsafe bypass if toBlobURL is missing or errors out
            if (util && typeof util.toBlobURL === 'function') {
                try {
                    coreURL = await util.toBlobURL(coreURL, 'text/javascript');
                    wasmURL = await util.toBlobURL(wasmURL, 'application/wasm');
                } catch (e) {
                    logMsg("Blob generation skipped. Using direct URLs...");
                }
            } else {
                logMsg("Utility bypass active. Using direct URLs...");
            }

            await ffmpeg.load({ coreURL, wasmURL });
            ffmpegInstance = ffmpeg;
            return ffmpegInstance;
        }

        window.startProcess = async function() {
            const jsonFile = document.getElementById('jsonInput').files[0];
            const audioFile = document.getElementById('audioInput').files[0];
            const zipFile = document.getElementById('zipInput').files[0];
            
            if (!jsonFile || !zipFile) return alert("You must provide both the JSON file and the ZIP file.");

            const btn = document.getElementById('generateBtn');
            btn.disabled = true; btn.innerText = "Processing...";
            document.getElementById('statusContainer').style.display = 'block';
            document.getElementById('resultContainer').style.display = 'none';
            document.getElementById('log').textContent = '';
            document.getElementById('progressFill').style.width = '0%';

            try {
                const ffmpeg = await initFFmpeg();
                
                document.getElementById('statusText').innerText = "Unzipping & Calculating Timings...";
                
                let audioFileName = null;
                if (audioFile) {
                    const ext = audioFile.name.substring(audioFile.name.lastIndexOf('.'));
                    audioFileName = 'audio_track' + ext;
                    await ffmpeg.writeFile(audioFileName, new Uint8Array(await audioFile.arrayBuffer()));
                }

                const sequenceData = JSON.parse(await jsonFile.text()).sort((a, b) => a.start - b.start);
                const zipBuffer = await zipFile.arrayBuffer();
                const zip = await JSZip.loadAsync(zipBuffer);

                let concatText = '';
                let currentTime = 0.0;
                let writtenFiles = new Set();

                for (let i = 0; i < sequenceData.length; i++) {
                    const item = sequenceData[i];

                    if (!writtenFiles.has(item.frame)) {
                        let fileInZip = zip.file(item.frame);
                        if (!fileInZip) {
                            const found = Object.keys(zip.files).find(name => name.endsWith('/' + item.frame) || name === item.frame);
                            if (found) fileInZip = zip.file(found);
                        }
                        
                        if (!fileInZip) throw new Error(`Could not find '${item.frame}' inside the ZIP!`);
                        
                        const imgData = await fileInZip.async('uint8array');
                        await ffmpeg.writeFile(item.frame, imgData);
                        writtenFiles.add(item.frame);
                    }

                    if (item.start > currentTime) {
                        const gap = item.start - currentTime;
                        concatText += `file '${i === 0 ? item.frame : sequenceData[i-1].frame}'\n`;
                        concatText += `duration ${gap.toFixed(3)}\n`;
                    }
                    
                    const duration = item.end - item.start;
                    concatText += `file '${item.frame}'\n`;
                    concatText += `duration ${duration.toFixed(3)}\n`;
                    currentTime = item.end;
                }

                if (sequenceData.length > 0) {
                    concatText += `file '${sequenceData[sequenceData.length - 1].frame}'\n`;
                }

                await ffmpeg.writeFile('input.txt', concatText);
                document.getElementById('statusText').innerText = "Encoding MP4 (This may take a while)...";

                let cmd = ['-f', 'concat', '-safe', '0', '-i', 'input.txt'];
                
                if (audioFileName) { cmd.push('-i', audioFileName); }

                cmd.push(
                    '-vf', 'scale=trunc(iw/2)*2:trunc(ih/2)*2',
                    '-c:v', 'libx264', 
                    '-preset', 'ultrafast', 
                    '-crf', '15', 
                    '-pix_fmt', 'yuv420p',
                    '-vsync', 'vfr', 
                    '-video_track_timescale', '1000'
                );

                if (audioFileName) { cmd.push('-c:a', 'aac', '-b:a', '192k', '-shortest'); }
                cmd.push('output.mp4');

                await ffmpeg.exec(cmd);

                const fileData = await ffmpeg.readFile('output.mp4');
                const videoUrl = URL.createObjectURL(new Blob([fileData.buffer], { type: 'video/mp4' }));

                document.getElementById('outputVideo').src = videoUrl;
                document.getElementById('downloadBtn').href = videoUrl;
                document.getElementById('statusContainer').style.display = 'none';
                document.getElementById('resultContainer').style.display = 'block';

            } catch (error) {
                alert("Error: " + error.message);
                document.getElementById('statusText').innerText = "Failed!";
                document.getElementById('progressFill').style.backgroundColor = "#ef4444";
            } finally {
                btn.disabled = false; btn.innerText = "Generate MP4 Video";
            }
        };
    });
</script>
</body>
</html>
